<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ULTIMATE RIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #020202;
        overflow: hidden;
        font-family: "Rajdhani", sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* CRT & VIGNETTE */
      .overlay-fx {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.8) 100%),
          repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.2) 3px);
        pointer-events: none;
        z-index: 5;
      }
      /* UI */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-box {
        text-align: center;
        margin: 0 5px;
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      }
      .hud-label {
        color: #0ff;
        font-size: 12px;
        letter-spacing: 2px;
        display: block;
        opacity: 0.8;
      }
      .hud-val {
        color: #fff;
        font-size: 24px;
        font-weight: 900;
      }
      #boss-hp-bar {
        position: absolute;
        top: 60px;
        left: 10%;
        width: 80%;
        height: 10px;
        background: rgba(255, 0, 0, 0.2);
        border: 1px solid #f00;
        display: none;
        box-shadow: 0 0 15px #f00;
      }
      #boss-hp-fill {
        width: 100%;
        height: 100%;
        background: #f00;
        transition: width 0.1s;
      }
      /* CONTROLS  */
      #controls {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        pointer-events: none;
      }
      #stick-zone {
        position: absolute;
        bottom: 30px;
        left: 30px;
        width: 160px;
        height: 160px;
        pointer-events: auto;
      }
      .stick-base {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(0, 255, 255, 0.05);
        border: 2px solid rgba(0, 255, 255, 0.2);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
      }
      .stick-knob {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: radial-gradient(circle, #0ff, #005555);
        box-shadow: 0 0 20px #0ff;
        transition: transform 0.05s;
      }
      #fire-btn {
        position: absolute;
        bottom: 50px;
        right: 40px;
        width: 90px;
        height: 90px;
        pointer-events: auto;
        border-radius: 50%;
        border: 3px solid rgba(255, 0, 80, 0.5);
        background: rgba(255, 0, 80, 0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 30px rgba(255, 0, 80, 0.3);
      }
      #fire-btn:active {
        background: rgba(255, 0, 80, 0.5);
        transform: scale(0.95);
      }
      /* MENUS */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 30;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(8px);
      }
      h1 {
        font-size: 50px;
        color: #fff;
        margin: 0;
        line-height: 1;
        text-shadow:
          3px 3px 0px #0ff,
          -3px -3px 0px #f0f;
        font-style: italic;
        letter-spacing: -2px;
        text-align: center;
      }
      h1 span {
        font-size: 30px;
        color: #f0f;
        display: block;
        margin-top: 5px;
        text-shadow: none;
      }
      .btn {
        margin-top: 30px;
        padding: 15px 50px;
        background: transparent;
        border: 2px solid #0ff;
        color: #0ff;
        font-family: "Rajdhani";
        font-size: 24px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 0 15px #0ff;
        transition: 0.2s;
        text-transform: uppercase;
      }
      .btn:hover {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 50px #0ff;
      }
      .mute-toggle {
        margin-top: 20px;
        font-size: 14px;
        color: #555;
        cursor: pointer;
        border: 1px solid #333;
        padding: 5px 10px;
      }
      .back {
        display: flex;
        justify-content: center;
        margin: 1rem auto;
      }
      .back a {
        text-decoration: none;
        color: #17d4fe;
        font-family: "Oxanium", sans-serif;
        font-weight: 500;
      }

      /* Raspberry Pi / low-power mode. Override with ?quality=high if needed. */
      body.low-power .overlay-fx {
        background: radial-gradient(circle, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.72) 100%);
      }
      body.low-power #overlay {
        backdrop-filter: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay-fx"></div>
      <div id="ui-layer">
        <div class="hud-row">
          <div class="hud-box">
            <span class="hud-label">SCORE</span>
            <span class="hud-val" id="score">0</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">HIGH SCORE</span>
            <span class="hud-val" id="hiscore">0</span>
          </div>
        </div>
        <div class="hud-row">
          <div class="hud-box" style="text-align: left">
            <span class="hud-label" style="color: #f0f">WAVE</span>
            <span class="hud-val" id="wave">1</span>
          </div>
          <div class="hud-box" style="text-align: right">
            <span class="hud-label" style="color: #0f0">SHIELD</span>
            <span class="hud-val" id="hp">100%</span>
          </div>
        </div>
        <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
      </div>
      <div id="controls">
        <div id="stick-zone">
          <div class="stick-base"></div>
          <div class="stick-knob" id="knob"></div>
        </div>
        <div id="fire-btn"></div>
      </div>
      <div id="overlay">
        <h1>ULTIMATE<br /><span>RIDE</span></h1>
        <button class="btn" onclick="Game.init()">PLAY GAME</button>
        <div class="mute-toggle" onclick="AudioSys.toggle()">SOUND: ON</div>
        <div class="back"><a href="index.html"> BACK</a></div>
      </div>
    </div>

    <script>
      "use strict";

      /*
       * PERFORMANCE PROFILE
       * - auto: low-power mode on 4-core devices and very large displays
       * - force low mode:  ?quality=low
       * - force high mode: ?quality=high
       */
      const qualityParam = new URLSearchParams(location.search).get("quality");
      const screenPixels = window.innerWidth * window.innerHeight;
      const autoLowPower = (navigator.hardwareConcurrency || 4) <= 4 || screenPixels > 2500000;
      const lowPower = qualityParam === "low" || (qualityParam !== "high" && autoLowPower);

      const PERF = {
        lowPower,
        renderScale: lowPower ? (screenPixels > 2500000 ? 0.5 : 0.75) : 1,
        glow: !lowPower,
        additiveBlend: !lowPower,
        maxParticles: lowPower ? 180 : 450,
        hudInterval: lowPower ? 120 : 60,
        frameInterval: lowPower ? 1000 / 45 : 0,
      };

      document.body.classList.toggle("low-power", PERF.lowPower);

      const TAU = Math.PI * 2;
      const chance = (probabilityPerFrame, dt) =>
        Math.random() < 1 - Math.pow(1 - probabilityPerFrame, dt);

      const compact = (items, keep) => {
        let write = 0;
        for (let read = 0; read < items.length; read++) {
          const item = items[read];
          if (keep(item)) items[write++] = item;
        }
        items.length = write;
      };

      const UI = {
        overlay: document.getElementById("overlay"),
        overlayTitle: document.querySelector("#overlay h1"),
        score: document.getElementById("score"),
        hiscore: document.getElementById("hiscore"),
        wave: document.getElementById("wave"),
        hp: document.getElementById("hp"),
        bossBar: document.getElementById("boss-hp-bar"),
        bossFill: document.getElementById("boss-hp-fill"),
        mute: document.querySelector(".mute-toggle"),
      };

      /* AUDIO SYSTEM */
      const AudioSys = {
        ctx: null,
        enabled: true,
        masterGain: null,
        noiseBuffer: null,
        lastEnemyShot: 0,
        lastExplosion: 0,

        init() {
          if (!this.enabled) return;

          if (this.ctx) {
            if (this.ctx.state === "suspended") this.ctx.resume();
            return;
          }

          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;

          this.ctx = new AC();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.3;
          this.masterGain.connect(this.ctx.destination);

          // Generate white noise once instead of rebuilding it for every explosion.
          const duration = 0.5;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        },

        playTone(freq, type, duration, vol = 1) {
          if (!this.ctx || !this.enabled) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(1, freq * 0.1), now + duration);

          gain.gain.setValueAtTime(Math.max(0.001, vol), now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + duration);
        },

        playNoise(duration) {
          if (!this.ctx || !this.enabled || !this.noiseBuffer) return;

          const nowMs = performance.now();
          if (nowMs - this.lastExplosion < 45) return;
          this.lastExplosion = nowMs;

          const now = this.ctx.currentTime;
          const noise = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          noise.buffer = this.noiseBuffer;
          filter.type = "lowpass";
          filter.frequency.value = 1000;

          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noise.start(now, 0, Math.min(duration, this.noiseBuffer.duration));
        },

        playShoot() {
          this.playTone(800, "sawtooth", 0.15, 0.5);
        },

        playEnemyShoot() {
          const now = performance.now();
          if (now - this.lastEnemyShot < 35) return;
          this.lastEnemyShot = now;
          this.playTone(200, "square", 0.3, 0.3);
        },

        playExplosion() {
          this.playNoise(0.4);
        },

        playPowerup() {
          if (!this.ctx || !this.enabled) return;
          this.playTone(600, "sine", 0.1);
          setTimeout(() => this.playTone(1200, "sine", 0.2), 100);
        },

        toggle() {
          this.enabled = !this.enabled;
          UI.mute.innerText = "SOUND: " + (this.enabled ? "ON" : "OFF");
          if (this.enabled) this.init();
        },
      };

      /* INPUT SYSTEM */
      const Input = { joyX: 0, joyY: 0, shooting: false };
      const stickZone = document.getElementById("stick-zone");
      const knob = document.getElementById("knob");
      let stickStart = null;

      const handleStick = (x, y, type) => {
        if (type === "start") {
          const rect = stickZone.getBoundingClientRect();
          stickStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          return;
        }

        if (type === "move" && stickStart) {
          const dx = x - stickStart.x;
          const dy = y - stickStart.y;
          const max = 40;
          const dist = Math.min(Math.hypot(dx, dy), max);
          const angle = Math.atan2(dy, dx);
          const mx = Math.cos(angle) * dist;
          const my = Math.sin(angle) * dist;

          knob.style.transform = `translate(calc(-50% + ${mx}px), calc(-50% + ${my}px))`;
          Input.joyX = mx / max;
          Input.joyY = my / max;
          return;
        }

        stickStart = null;
        knob.style.transform = "translate(-50%, -50%)";
        Input.joyX = 0;
        Input.joyY = 0;
      };

      stickZone.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          handleStick(e.touches[0].clientX, e.touches[0].clientY, "start");
        },
        { passive: false },
      );

      stickZone.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          handleStick(e.touches[0].clientX, e.touches[0].clientY, "move");
        },
        { passive: false },
      );

      stickZone.addEventListener(
        "touchend",
        (e) => {
          e.preventDefault();
          handleStick(0, 0, "end");
        },
        { passive: false },
      );

      const fireBtn = document.getElementById("fire-btn");
      const setFire = (value) => (Input.shooting = value);

      fireBtn.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          setFire(true);
        },
        { passive: false },
      );

      fireBtn.addEventListener(
        "touchend",
        (e) => {
          e.preventDefault();
          setFire(false);
        },
        { passive: false },
      );

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") Input.joyX = -1;
        if (e.key === "ArrowRight") Input.joyX = 1;
        if (e.key === "ArrowUp") Input.joyY = -1;
        if (e.key === "ArrowDown") Input.joyY = 1;
        if (e.code === "Space") Input.shooting = true;
      });

      window.addEventListener("keyup", (e) => {
        if (["ArrowLeft", "ArrowRight"].includes(e.key)) Input.joyX = 0;
        if (["ArrowUp", "ArrowDown"].includes(e.key)) Input.joyY = 0;
        if (e.code === "Space") Input.shooting = false;
      });

      /* CANVAS */
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", {
        alpha: false,
        desynchronized: true,
      });

      let W = 0;
      let H = 0;

      const resize = () => {
        W = window.innerWidth;
        H = window.innerHeight;

        canvas.width = Math.max(1, Math.floor(W * PERF.renderScale));
        canvas.height = Math.max(1, Math.floor(H * PERF.renderScale));

        // Game coordinates stay in CSS pixels while the internal buffer is smaller.
        ctx.setTransform(PERF.renderScale, 0, 0, PERF.renderScale, 0, 0);
        ctx.imageSmoothingEnabled = false;
      };

      window.addEventListener("resize", resize, { passive: true });
      resize();

      let glitchAmt = 0;
      let floaters = [];

      const spawnText = (x, y, txt, col) => {
        floaters.push({ x, y, txt, col, life: 1, vy: -2 });
      };

      class Particle {
        constructor(x, y, col, speed, type) {
          this.x = x;
          this.y = y;
          this.col = col;

          const angle = Math.random() * TAU;
          const velocity = Math.random() * speed;
          this.vx = Math.cos(angle) * velocity;
          this.vy = Math.sin(angle) * velocity;

          this.life = 1;
          this.decay = Math.random() * 0.03 + 0.02;
          this.type = type;
        }

        update(dt) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.life -= this.decay * dt;
          if (this.type === 1) this.life -= 0.05 * dt;
        }

        draw() {
          ctx.globalAlpha = Math.max(0, this.life);

          if (this.type === 1) {
            ctx.strokeStyle = this.col;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, (1 - this.life) * 50, 0, TAU);
            ctx.stroke();
          } else {
            ctx.fillStyle = this.col;
            ctx.fillRect(this.x, this.y, 3, 3);
          }
        }
      }

      class PowerUp {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.type = Math.random() > 0.5 ? "M" : "S";
          this.col = this.type === "M" ? "#f0f" : "#0f0";
        }

        update(dt) {
          this.y += 2 * dt;
        }

        draw() {
          ctx.shadowBlur = PERF.glow ? 10 : 0;
          if (PERF.glow) ctx.shadowColor = this.col;

          ctx.fillStyle = "#000";
          ctx.strokeStyle = this.col;
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.arc(this.x, this.y, 15, 0, TAU);
          ctx.fill();
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = "#fff";
          ctx.font = "bold 16px Arial";
          ctx.textAlign = "center";
          ctx.fillText(this.type, this.x, this.y + 5);
        }
      }

      class Bullet {
        constructor(x, y, isEnemy, vx = 0) {
          this.x = x;
          this.y = y;
          this.isEnemy = isEnemy;
          this.vx = vx;
          this.vy = isEnemy ? 6 : -12;
          this.col = isEnemy ? "#f00" : "#0ff";
          this.dead = false;
        }

        update(dt) {
          this.x += this.vx * dt;
          this.y += this.vy * dt;

          if (this.y < -20 || this.y > H + 20 || this.x < -20 || this.x > W + 20) {
            this.dead = true;
          }
        }

        draw() {
          ctx.shadowBlur = PERF.glow ? 8 : 0;
          if (PERF.glow) ctx.shadowColor = this.col;
          ctx.fillStyle = this.col;
          ctx.fillRect(this.x - 2, this.y - 5, 4, 15);
          ctx.shadowBlur = 0;
        }
      }

      class Boss {
        constructor() {
          this.x = W / 2;
          this.y = -100;
          this.hp = 500;
          this.maxHp = 500;
          this.active = false;
          this.dir = 1;
        }

        update(dt) {
          if (this.y < 100) {
            this.y += 2 * dt;
          } else {
            this.active = true;
          }

          if (!this.active) return;

          this.x += this.dir * 2 * dt;
          if (this.x > W - 80 || this.x < 80) this.dir *= -1;

          if (chance(0.05, dt)) {
            AudioSys.playEnemyShoot();
            for (let i = -2; i <= 2; i++) {
              Game.bullets.push(new Bullet(this.x, this.y + 40, true, i));
            }
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);

          ctx.shadowBlur = PERF.glow ? 24 : 0;
          if (PERF.glow) ctx.shadowColor = "#f00";

          ctx.fillStyle = "#300";
          ctx.strokeStyle = "#f00";
          ctx.lineWidth = 4;

          ctx.beginPath();
          ctx.moveTo(-60, -20);
          ctx.lineTo(60, -20);
          ctx.lineTo(40, 40);
          ctx.lineTo(0, 60);
          ctx.lineTo(-40, 40);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = `rgba(255, 0, 0, ${0.5 + Math.sin(Game.now / 100) * 0.5})`;
          ctx.beginPath();
          ctx.arc(0, 10, 15, 0, TAU);
          ctx.fill();

          ctx.restore();
        }
      }

      const Game = {
        running: false,
        rafId: 0,
        gameOverTimer: 0,
        lastFrame: 0,
        lastHudUpdate: 0,
        now: 0,

        score: 0,
        highScore: Number(localStorage.getItem("neon_hiscore")) || 0,
        wave: 1,

        particles: [],
        bullets: [],
        enemies: [],
        powerups: [],

        player: {
          x: 0,
          y: 0,
          hp: 100,
          dead: false,
          weaponLevel: 1,
          shield: 0,
          cooldown: 0,
        },

        boss: null,
        bgOffset: 0,

        init() {
          AudioSys.init();

          if (this.rafId) cancelAnimationFrame(this.rafId);
          if (this.gameOverTimer) clearTimeout(this.gameOverTimer);

          UI.overlay.style.display = "none";
          UI.hiscore.innerText = String(this.highScore);

          this.player.x = W / 2;
          this.player.y = H - 100;
          this.player.hp = 100;
          this.player.dead = false;
          this.player.weaponLevel = 1;
          this.player.shield = 0;
          this.player.cooldown = 0;

          this.score = 0;
          this.wave = 0;
          this.bgOffset = 0;
          glitchAmt = 0;
          floaters = [];

          this.bullets.length = 0;
          this.particles.length = 0;
          this.powerups.length = 0;
          this.enemies.length = 0;

          this.boss = null;
          this.nextWave();

          this.running = true;
          this.now = performance.now();
          this.lastFrame = this.now;
          this.lastHudUpdate = 0;
          this.updateHud(true);

          // Exactly one animation loop exists at a time.
          this.rafId = requestAnimationFrame(Game.loop);
        },

        nextWave() {
          this.wave++;
          UI.wave.innerText = String(this.wave);
          this.enemies.length = 0;

          if (this.wave % 5 === 0) {
            this.boss = new Boss();
            this.boss.maxHp = 500 * (this.wave / 5);
            this.boss.hp = this.boss.maxHp;
            UI.bossBar.style.display = "block";
            return;
          }

          UI.bossBar.style.display = "none";
          this.boss = null;

          const rows = 3 + Math.min(this.wave, 5);
          const cols = 4 + Math.min(this.wave, 4);
          const startX = (W - cols * 50) / 2;

          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              let type = row === 0 ? 1 : 0;
              if (this.wave > 2 && Math.random() < 0.2) type = 2;

              this.enemies.push({
                x: startX + col * 50,
                y: -200 + row * 50,
                type,
                hp: (type + 1) * 10,
                ty: 80 + row * 50,
                state: "enter",
                col: type === 2 ? "#f00" : type === 1 ? "#f0f" : "#0f0",
              });
            }
          }
        },

        shake(amount) {
          glitchAmt = amount;
          if (navigator.vibrate) navigator.vibrate(amount * 5);
        },

        update(dt) {
          if (!this.running) return;

          const player = this.player;

          if (!player.dead) {
            player.x += Input.joyX * 6 * dt;
            player.y += Input.joyY * 6 * dt;

            player.x = Math.max(20, Math.min(W - 20, player.x));
            player.y = Math.max(H / 2, Math.min(H - 40, player.y));

            if (Input.shooting && player.cooldown <= 0) {
              AudioSys.playShoot();
              player.cooldown = 10;

              this.bullets.push(new Bullet(player.x, player.y - 20, false));

              if (player.weaponLevel > 1) {
                this.bullets.push(new Bullet(player.x - 10, player.y - 15, false, -1));
                this.bullets.push(new Bullet(player.x + 10, player.y - 15, false, 1));
              }
            }

            player.cooldown = Math.max(0, player.cooldown - dt);
          }

          if (this.boss) {
            this.boss.update(dt);

            if (
              !player.dead &&
              Math.abs(this.boss.x - player.x) < 80 &&
              Math.abs(this.boss.y - player.y) < 60
            ) {
              this.damagePlayer(100);
            }
          }

          let activeEnemies = false;

          for (let i = 0; i < this.enemies.length; i++) {
            const enemy = this.enemies[i];
            if (enemy.hp <= 0) continue;

            activeEnemies = true;

            if (enemy.state === "enter") {
              const easing = 1 - Math.pow(0.95, dt);
              enemy.y += (enemy.ty - enemy.y) * easing;
              if (Math.abs(enemy.y - enemy.ty) < 2) enemy.state = "idle";
            } else if (enemy.state === "idle") {
              enemy.x += Math.sin(this.now / 500) * 2 * dt;

              if (enemy.type === 2 && chance(0.005, dt)) enemy.state = "dive";

              if (enemy.type === 1 && chance(0.005, dt)) {
                AudioSys.playEnemyShoot();
                this.bullets.push(new Bullet(enemy.x, enemy.y + 20, true));
              }
            } else if (enemy.state === "dive") {
              enemy.y += 6 * dt;
              enemy.x += (player.x - enemy.x) * (1 - Math.pow(0.98, dt));
              if (enemy.y > H) enemy.hp = 0;
            }

            if (
              !player.dead &&
              Math.abs(enemy.x - player.x) < 30 &&
              Math.abs(enemy.y - player.y) < 30
            ) {
              enemy.hp = 0;
              this.damagePlayer(20);
            }
          }

          if (!activeEnemies && !this.boss) this.nextWave();

          for (let bulletIndex = 0; bulletIndex < this.bullets.length; bulletIndex++) {
            const bullet = this.bullets[bulletIndex];
            bullet.update(dt);
            if (bullet.dead) continue;

            if (bullet.isEnemy) {
              if (
                !player.dead &&
                Math.abs(bullet.x - player.x) < 20 &&
                Math.abs(bullet.y - player.y) < 20
              ) {
                bullet.dead = true;
                this.damagePlayer(20);
              }
              continue;
            }

            if (
              this.boss &&
              Math.abs(bullet.x - this.boss.x) < 60 &&
              Math.abs(bullet.y - this.boss.y) < 40
            ) {
              this.boss.hp -= 10;
              bullet.dead = true;

              spawnText(
                this.boss.x + (Math.random() - 0.5) * 40,
                this.boss.y + 20,
                "-10",
                "#fff",
              );

              if (this.boss.hp <= 0) {
                this.explode(this.boss.x, this.boss.y, "#f00", 50);
                this.score += 1000;
                this.boss = null;
                UI.bossBar.style.display = "none";
              }
              continue;
            }

            for (let enemyIndex = 0; enemyIndex < this.enemies.length; enemyIndex++) {
              const enemy = this.enemies[enemyIndex];

              if (
                enemy.hp > 0 &&
                Math.abs(bullet.x - enemy.x) < 20 &&
                Math.abs(bullet.y - enemy.y) < 20
              ) {
                enemy.hp -= 10;
                bullet.dead = true;

                if (enemy.hp <= 0) {
                  this.explode(enemy.x, enemy.y, enemy.col, 10);
                  this.score += 50;

                  if (Math.random() < 0.1) {
                    this.powerups.push(new PowerUp(enemy.x, enemy.y));
                  }
                } else {
                  spawnText(enemy.x, enemy.y - 10, "-10", "#fff");
                }

                break;
              }
            }
          }

          compact(this.bullets, (bullet) => !bullet.dead);

          for (let i = 0; i < this.powerups.length; i++) {
            const powerup = this.powerups[i];
            powerup.update(dt);

            if (
              Math.abs(powerup.x - player.x) < 30 &&
              Math.abs(powerup.y - player.y) < 30
            ) {
              AudioSys.playPowerup();

              if (powerup.type === "M") {
                player.weaponLevel = 2;
                spawnText(player.x, player.y - 30, "MULTI-SHOT", "#f0f");
              } else {
                player.shield = 100;
                spawnText(player.x, player.y - 30, "SHIELD UP", "#0f0");
              }

              powerup.y = H + 100;
            }
          }

          compact(this.powerups, (powerup) => powerup.y < H);

          for (let i = 0; i < this.particles.length; i++) {
            this.particles[i].update(dt);
          }
          compact(this.particles, (particle) => particle.life > 0);

          for (let i = 0; i < floaters.length; i++) {
            const floater = floaters[i];
            floater.y += floater.vy * dt;
            floater.life -= 0.02 * dt;
          }
          compact(floaters, (floater) => floater.life > 0);

          this.bgOffset = (this.bgOffset + dt) % 40;
          glitchAmt = Math.max(0, glitchAmt - dt);

          this.updateHud();
        },

        updateHud(force = false) {
          if (!force && this.now - this.lastHudUpdate < PERF.hudInterval) return;
          this.lastHudUpdate = this.now;

          const scoreText = String(this.score);
          if (UI.score.innerText !== scoreText) UI.score.innerText = scoreText;

          const hpText =
            this.player.shield > 0
              ? `SHIELD ${Math.ceil(this.player.shield)}%`
              : `${Math.max(0, Math.ceil(this.player.hp))}%`;

          if (UI.hp.innerText !== hpText) UI.hp.innerText = hpText;

          const hpColor =
            this.player.shield > 0 ? "#0f0" : this.player.hp < 30 ? "#f00" : "#0ff";

          if (UI.hp.style.color !== hpColor) UI.hp.style.color = hpColor;

          if (this.boss) {
            const width = `${Math.max(0, (this.boss.hp / this.boss.maxHp) * 100)}%`;
            if (UI.bossFill.style.width !== width) UI.bossFill.style.width = width;
          }
        },

        damagePlayer(amount) {
          const player = this.player;
          if (player.dead) return;

          if (player.shield > 0) {
            player.shield = Math.max(0, player.shield - amount);
            spawnText(player.x, player.y, "ABSORBED", "#0f0");
            return;
          }

          player.hp -= amount;
          this.shake(20);
          spawnText(player.x, player.y, `-${amount}`, "#f00");

          if (player.hp > 0) return;

          player.dead = true;
          this.explode(player.x, player.y, "#0ff", 40);
          AudioSys.playExplosion();

          this.gameOverTimer = setTimeout(() => {
            this.running = false;

            if (this.score > this.highScore) {
              this.highScore = this.score;
              localStorage.setItem("neon_hiscore", String(this.highScore));
            }

            UI.hiscore.innerText = String(this.highScore);
            UI.overlay.style.display = "flex";
            UI.overlayTitle.innerHTML = `GAME OVER<br><span>SCORE: ${this.score}</span>`;
          }, 2000);
        },

        explode(x, y, col, count) {
          AudioSys.playExplosion();

          if (this.particles.length < PERF.maxParticles) {
            this.particles.push(new Particle(x, y, col, 0, 1));
          }

          const available = Math.max(0, PERF.maxParticles - this.particles.length);
          const actualCount = Math.min(count, available);

          for (let i = 0; i < actualCount; i++) {
            this.particles.push(new Particle(x, y, col, 8, 0));
          }
        },

        draw() {
          const offsetX = glitchAmt > 0 ? (Math.random() - 0.5) * glitchAmt : 0;

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);

          ctx.save();
          ctx.translate(offsetX, 0);

          ctx.strokeStyle = "rgba(0, 50, 100, 0.3)";
          ctx.lineWidth = 1;
          ctx.beginPath();

          const verticalStep = PERF.lowPower ? 120 : 80;
          for (let x = -W; x < W * 2; x += verticalStep) {
            ctx.moveTo(x, H);
            ctx.lineTo((x - W / 2) * 0.1 + W / 2, 0);
          }

          const horizontalStep = PERF.lowPower ? 60 : 40;
          for (let y = H / 2; y < H + horizontalStep; y += horizontalStep) {
            const shiftedY = H / 2 + ((y - H / 2 + this.bgOffset) % (H / 2));
            ctx.moveTo(0, shiftedY);
            ctx.lineTo(W, shiftedY);
          }

          ctx.stroke();

          ctx.globalCompositeOperation = PERF.additiveBlend ? "lighter" : "source-over";

          for (let i = 0; i < this.powerups.length; i++) this.powerups[i].draw();

          if (!this.player.dead) {
            ctx.save();
            ctx.translate(this.player.x, this.player.y);
            ctx.rotate(Input.joyX * 0.2);

            const playerColor = this.player.shield > 0 ? "#0f0" : "#0ff";
            ctx.shadowBlur = PERF.glow ? 18 : 0;
            if (PERF.glow) ctx.shadowColor = playerColor;
            ctx.strokeStyle = playerColor;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(15, 15);
            ctx.lineTo(0, 10);
            ctx.lineTo(-15, 15);
            ctx.closePath();
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#f0f";
            ctx.beginPath();
            ctx.moveTo(-5, 15);
            ctx.lineTo(5, 15);
            ctx.lineTo(0, 30 + Math.random() * 10);
            ctx.fill();

            ctx.restore();
          }

          for (let i = 0; i < this.enemies.length; i++) {
            const enemy = this.enemies[i];
            if (enemy.hp <= 0) continue;

            ctx.save();
            ctx.translate(enemy.x, enemy.y);

            ctx.shadowBlur = PERF.glow ? 12 : 0;
            if (PERF.glow) ctx.shadowColor = enemy.col;
            ctx.fillStyle = enemy.col;

            if (enemy.type === 0) {
              ctx.fillRect(-15, -10, 30, 20);
              ctx.clearRect(-5, -5, 10, 10);
            } else if (enemy.type === 1) {
              ctx.beginPath();
              ctx.moveTo(-15, -10);
              ctx.lineTo(15, -10);
              ctx.lineTo(0, 15);
              ctx.fill();
            } else {
              ctx.beginPath();
              ctx.arc(0, 0, 15, 0, TAU);
              ctx.moveTo(-20, 0);
              ctx.lineTo(20, 0);
              ctx.strokeStyle = enemy.col;
              ctx.stroke();
            }

            ctx.restore();
          }

          if (this.boss) this.boss.draw();

          for (let i = 0; i < this.bullets.length; i++) this.bullets[i].draw();

          ctx.shadowBlur = 0;
          for (let i = 0; i < this.particles.length; i++) this.particles[i].draw();

          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.font = "bold 20px Rajdhani";
          ctx.textAlign = "center";

          for (let i = 0; i < floaters.length; i++) {
            const floater = floaters[i];
            ctx.globalAlpha = Math.max(0, floater.life);
            ctx.fillStyle = floater.col;
            ctx.fillText(floater.txt, floater.x, floater.y);
          }

          ctx.globalAlpha = 1;
          ctx.restore();
        },

        loop(timestamp) {
          if (!Game.running) {
            Game.rafId = 0;
            return;
          }

          const elapsed = timestamp - Game.lastFrame;

          if (PERF.frameInterval && elapsed < PERF.frameInterval) {
            Game.rafId = requestAnimationFrame(Game.loop);
            return;
          }

          Game.lastFrame = timestamp;
          Game.now = timestamp;

          const dt = Math.min(2.5, Math.max(0.25, elapsed / (1000 / 60)));
          Game.update(dt);
          Game.draw();

          Game.rafId = requestAnimationFrame(Game.loop);
        },
      };
    </script>
  </body>
