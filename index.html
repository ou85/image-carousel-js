<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smooth Images Carousel</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="carousel.css" />


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"  />

    <script src="images.js" defer></script>
    <script src="carousel.js" defer></script>
    <script src="clock.js" defer></script>
  </head>
  <body>
    <div id="clock" class="clock" onload="showTime()"></div>

    <main class="page">
      <div class="carousel" id="carousel" aria-label="Image carousel"></div>
    </main>

    <div id="dclock" class="big-clock" v-cloak>
      <p class="date">{{ date }}</p>
      <p class="time">{{ time }}</p>
    </div>

    <div class="footer">
      <a href="ride.html?quality=low">LOW RIDE</a>
      <span>:::</span>
      <a href="#" id="bigClockButton">BIG CLOCK</a>
      <span>:::</span>
      <a href="ride.html?quality=high">HIGH RIDE</a>
    </div>

    <script src="vue.min.js"></script>
    <script src="clock_digi.js"></script>
  </body>
</html>
